<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ちいかゲーム</title>
  <style>
    body {
      margin: 0;
      /* チイカゲームと同じ水色の背景 */
      background: #caedf8; 
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 50px 20px;
    }
    
    h1 {
      color: #333;
      font-size: 36px;
      margin-bottom: 40px;
      text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.8);
      letter-spacing: 2px;
    }

    .game-container {
      display: flex;
      gap: 40px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .game-card {
      background: #fff;
      border-radius: 24px;
      width: 260px;
      padding: 24px;
      text-align: center;
      text-decoration: none;
      color: #333;
      box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
      border: 4px solid transparent;
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
    }

    /* マウスを乗せた時のフワッと浮くアニメーション */
    .game-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 12px 25px rgba(0, 0, 0, 0.15);
      border-color: #05f019; /* ホバー時にチイカゲームの黄緑色に光る */
    }

    .game-icon {
      width: 160px;
      height: 160px;
      object-fit: contain;
      margin: 0 auto 15px;
      display: block;
    }

    .game-title {
      font-size: 24px;
      font-weight: bold;
      margin: 10px 0;
      color: #ff6b6b; /* タイトルを少しポップな色に */
    }

    .game-desc {
      font-size: 14px;
      color: #666;
      line-height: 1.5;
      margin: 0;
    }
  </style>
</head>
<body>

  <h1>🎮 ちいかゲーム 🎮</h1>

  <div class="game-container">
    
    <!-- ▼ 1つ目のゲーム（チイカゲーム）へのリンク ▼ -->
    <!-- href="リンク先のファイル名" に設定します -->
    <a href="chi-kagame.html" class="game-card">
      <!-- サムネイル画像（例として tiikawa.png を指定） -->
      <img src="ちいかゲーム.png" alt="チイカゲーム" class="game-icon">
      <p class="game-title">ちいかゲーム</p>
      <p class="game-desc">同じキャラをくっつけて進化させよう！討伐失敗ラインに気をつけて！</p>
    </a>

    <!-- ▼ 2つ目のゲームへのリンク ▼ -->
    <a href="chi-ka_shima.html" class="game-card">
      <!-- サムネイル画像（用意した画像の名前に変えてください） -->
      <img src="ちいかゲーム島編.jpeg" alt="もう一つのゲーム" class="game-icon" onerror="this.src='https://via.placeholder.com/160x160?text=No+Image'">
      <p class="game-title">ちいかゲーム 島編</p>
      <p class="game-desc">同じキャラをくっつけて進化させよう！セイレーンから島を守ろう！</p>
    </a>

  </div>

</body>
</html>
